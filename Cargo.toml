[package]
name = "raur"
version = "1.2.0"
edition = "2024"

[lib]
name = "raur_lib"
path = "src/lib.rs"

[[bin]]
name = "raur"
path = "src/main.rs"

[dependencies]
ansi_term = "0.12.1"
clap = { version = "4.0", features = ["derive"] }
nix = { version = "0.30.1", features = ["user"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
